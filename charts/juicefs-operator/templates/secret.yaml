{{- if and .Values.dashboard.enabled .Values.dashboard.auth.enabled (not .Values.dashboard.auth.existingSecret) }}
kind: Secret
apiVersion: v1
metadata:
  name: juicefs-dashboard-secret
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/component: dashboard-secret
    {{- include "juicefs-operator.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ required "dashboard.auth.username is required" .Values.dashboard.auth.username | b64enc | quote }}
  {{- if .Values.dashboard.auth.password }}
  password: {{ .Values.dashboard.auth.password | b64enc | quote }}
  {{- else }}
  {{- $secret := lookup "v1" "Secret" .Release.Namespace "juicefs-dashboard-secret" }}
  password: {{ or (dig "data" "password" "" $secret) (randAlphaNum 32 | b64enc) | quote }}
  {{- end }}
{{- end }}
