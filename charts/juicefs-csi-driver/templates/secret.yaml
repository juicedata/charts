{{- $certEnabled := .Values.webhook.certManager.enabled }}

{{- if or (contains "sidecar" .Values.mountMode) (.Values.validatingWebhook.enabled)  (contains "serverless" .Values.mountMode) }}
{{- if not $certEnabled }}
kind: Secret
apiVersion: v1
metadata:
  name: juicefs-webhook-certs
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/component: webhook-secret
    {{- include "juicefs-csi.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ b64enc (include "webhook.caBundleCertPEM" .) }}
  tls.crt: {{ b64enc (include "webhook.certPEM" .) }}
  tls.key: {{ b64enc (include "webhook.keyPEM" .) }}
{{- end }}
{{- end }}
{{- if and .Values.dashboard.enabled .Values.dashboard.auth.enabled (not .Values.dashboard.auth.existingSecret) }}
---
kind: Secret
apiVersion: v1
metadata:
  name: juicefs-dashboard-secret
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/component: dashboard-secret
    {{- include "juicefs-csi.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ required "dashboard.auth.username is required" .Values.dashboard.auth.username | b64enc | quote }}
  {{- if .Values.dashboard.auth.password }}
  password: {{ .Values.dashboard.auth.password | b64enc | quote }}
  {{- else }}
  {{- $secret := lookup "v1" "Secret" .Release.Namespace "juicefs-dashboard-secret" }}
  password: {{ or (dig "data" "password" "" $secret) (randAlphaNum 32 | b64enc) | quote }}
  {{- end }}
{{- end }}